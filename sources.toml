# Źródła list blokowania. Updater czyta ten plik co 30 s, więc zmiany działają bez restartu.
#   package  pakiet z blocky.yml: scam, watpliwe, reklamy, smart-tv, windows, bez-google, bez-facebooka, dorosli, hazard
#   every    co ile minut pobierać (HaGeZi i OISD proszą o nie częściej niż raz na dobę)
#   license  sprawdź przed użyciem komercyjnym; "nieznana" i "brak" trzeba wyjaśnić z autorem
#   enabled  false = pominięta (np. licencje NC); usunięcie lub wyłączenie kasuje jej domeny z bazy
# Pominięte martwe i zagnieżdżone listy oraz powody: LISTY.md

# Pakiet "top" w blocky.yml: tylu najpopularniejszych stron (Tranco, z subdomenami) tryby inne niż ultra nie blokują
safe_top = 1000

# co 5 min, prośba CERT
[[source]]
name = "cert"
url = "https://hole.cert.pl/domains/v2/domains.txt"
package = "scam"
every = 5
license = "CERT Polska: dowolny cel"

