<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel audytora</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=tsReady" async defer></script>
<style>
  :root { --paper: #efece4; --paper-2: #e6e2d8; --ink: #151412; --ink-2: #5d584f; --rule: #cdc7ba; --red: #d3361b;
    --green: #2f6b45; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #141311; --paper-2: #1b1a17; --ink: #ece7dc; --ink-2: #9a948a; --rule: #34312c; --red: #ff5b3d;
      --green: #74c08e; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font: 400 15px/1.45 system-ui, sans-serif; display: grid; place-items: center; padding: 16px; }
  main { width: 100%; max-width: 380px; }
  h1 { font-size: 20px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  h1 i { width: 10px; height: 10px; background: var(--red); display: inline-block; }
  p { color: var(--ink-2); margin: 0 0 20px; }
  form { display: grid; gap: 12px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
  input, textarea { font: inherit; color: var(--ink); background: var(--paper-2); border: 1px solid var(--rule);
    padding: 9px 10px; width: 100%; }
  textarea { resize: vertical; min-height: 70px; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  button { font: inherit; font-weight: 600; padding: 10px; border: 1px solid var(--ink); background: var(--ink);
    color: var(--paper); cursor: pointer; }
  .switch { background: none; color: var(--ink); border: 0; padding: 0; text-decoration: underline; font-weight: 400;
    justify-self: start; }
  .msg { min-height: 1.4em; margin: 0; }
  .msg.bad { color: var(--red); }
  .msg.good { color: var(--green); }
  .count { justify-self: end; font: 12px ui-monospace, monospace; }
  .count.near { color: var(--red); font-weight: 700; }
  [hidden] { display: none; }
  dialog { border: 0; padding: 32px 28px 24px; width: min(420px, calc(100% - 32px)); background: var(--paper);
    color: var(--ink); text-align: center; box-shadow: 0 24px 80px rgb(0 0 0 / .35); }
  dialog::backdrop { background: rgb(21 20 18 / .6); backdrop-filter: blur(3px); }
  dialog .sign { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center;
    color: var(--paper); font-size: 34px; font-weight: 700; line-height: 1; background: var(--green); }
  dialog.bad .sign { background: var(--red); }
  dialog h2 { font-size: 22px; margin: 0 0 8px; }
  dialog p { margin: 0 0 22px; }
  dialog button { width: 100%; }
  @media (prefers-reduced-motion: no-preference) {
    dialog[open] { animation: pop .22s ease-out; }
    @keyframes pop { from { opacity: 0; transform: scale(.94); } }
  }
</style>
</head>
<body>
<main>
  <h1><i></i>Panel audytora</h1>
  <p id="lead">Zaloguj się, aby oceniać strony z kolejki.</p>
  <form id="login">
    <label>E-mail <input name="login" type="email" autocomplete="username" required></label>
    <label>Hasło <input name="password" type="password" autocomplete="current-password" required></label>
    <button>Zaloguj</button>
    <button type="button" class="switch" data-to="signup">Nie masz konta? Zgłoś się</button>
  </form>
  <form id="signup" hidden>
    <label>E-mail <input name="login" type="email" autocomplete="username" maxlength="254" required></label>
    <label>Hasło (co najmniej 12 znaków) <input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></label>
    <label>Kim jesteś? (dla właściciela, który zatwierdza konta) <textarea name="note" maxlength="1000" required aria-describedby="note-count"></textarea>
      <small class="count" id="note-count">0 / 1000</small></label>
    <div id="ts"></div>
    <button>Wyślij zgłoszenie</button>
    <button type="button" class="switch" data-to="login">Masz już konto? Zaloguj się</button>
  </form>
  <p class="msg" id="msg" role="status"></p>
</main>
<dialog id="said">
  <div class="sign" aria-hidden="true"></div>
  <h2></h2>
  <p></p>
  <button type="button" autofocus>OK</button>
</dialog>
<script>
const msg = document.getElementById("msg"), said = document.getElementById("said");
function say(text, good) { msg.textContent = text; msg.className = "msg " + (good ? "good" : "bad"); }
function show(good, title, text) {
  said.className = good ? "" : "bad";
  said.querySelector(".sign").textContent = good ? "✓" : "!";
  said.querySelector("h2").textContent = title;
  said.querySelector("p").textContent = text;
  said.showModal();
}
said.querySelector("button").onclick = () => said.close();
said.onclick = event => { if (event.target === said) said.close(); };  // a click on the dimmed backdrop
// Turnstile drawn when the sign-up form shows: in a hidden form it may not draw at all
let tsWanted = false, tsDrawn = false;
function tsReady() {
  if (tsWanted && !tsDrawn && window.turnstile) {
    tsDrawn = true;
    turnstile.render("#ts", { sitekey: "TURNSTILE_SITE", language: "pl" });
  }
}
function switchTo(to) {
  document.getElementById("login").hidden = to !== "login";
  document.getElementById("signup").hidden = to !== "signup";
  document.getElementById("lead").textContent = to === "login" ? "Zaloguj się, aby oceniać strony z kolejki."
    : "Konto zacznie działać, gdy właściciel je zatwierdzi.";
  say("");
  if (to === "signup") { tsWanted = true; tsReady(); }
}
// typed so far against the limit: "950 / 1000", red past 90%
const note = document.querySelector("#signup textarea"), noteCount = document.getElementById("note-count");
const count = () => {
  noteCount.textContent = `${note.value.length} / ${note.maxLength}`;
  noteCount.classList.toggle("near", note.value.length > note.maxLength * 0.9);
};
note.addEventListener("input", count);
for (const button of document.querySelectorAll(".switch")) {
  button.onclick = () => switchTo(button.dataset.to);
}
for (const form of document.querySelectorAll("form")) {
  form.onsubmit = async event => {
    event.preventDefault();
    const res = await fetch(`/api/${form.id}`, { method: "POST", headers: { "Content-Type": "application/json", "X-Panel": "1" },
                                                 body: JSON.stringify(Object.fromEntries(new FormData(form))) }).catch(() => null);
    const data = res ? await res.json().catch(() => ({})) : {};
    if (form.id === "login") return res && res.ok ? location.href = "/" : say(data.error || "Coś poszło nie tak, spróbuj ponownie.");
    if (window.turnstile && tsDrawn) turnstile.reset("#ts");  // one answer per sending
    if (!res || !res.ok) return show(false, "Nie udało się wysłać", data.error || "Coś poszło nie tak, spróbuj ponownie.");
    const email = form.elements.login.value;
    form.reset();
    count();
    switchTo("login");
    document.querySelector("#login [name=login]").value = email;
    show(true, "Dziękujemy, zgłoszenie przyjęte", (data.mail ? `Potwierdzenie wysłaliśmy na ${email}. ` : "")
      + "Odpowiemy w ciągu doby. Gdy zatwierdzimy konto, zalogujesz się tym e-mailem i hasłem.");
  };
}
</script>
</body>
</html>
